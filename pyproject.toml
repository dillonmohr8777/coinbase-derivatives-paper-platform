[project]
name = "whale-desk"
version = "0.1.0"
description = "AI trading bot + whale-trade intelligence radar (paper-money-first). Codex handoff scaffold."
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
