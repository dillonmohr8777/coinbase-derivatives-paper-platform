# Copy this file to .github/workflows/whale-desk-ci.yml after the publishing token has
# GitHub's workflow scope. It is kept here so CI remains reviewable without weakening auth.
name: Whale Desk CI

on:
  push:
    paths: ["codex-handoff/scaffold/**", ".github/workflows/whale-desk-ci.yml"]
  pull_request:
    paths: ["codex-handoff/scaffold/**", ".github/workflows/whale-desk-ci.yml"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: codex-handoff/scaffold
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: codex-handoff/scaffold/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pip install pip-audit
      - run: python -m ruff check app tests
      - run: python -m mypy app
      - run: python -m pytest
      - run: python -m compileall -q app config tests
      - run: python -m pip_audit -r requirements.txt
      - name: Reject committed secrets
        shell: bash
        run: |
          if git grep -En '(BEGIN (RSA|EC|OPENSSH) PRIVATE KEY|sk-[A-Za-z0-9]{20,}|gh[opusr]_[A-Za-z0-9]{20,})' -- . ':!*.example'; then
            echo 'Potential secret committed'
            exit 1
          fi
